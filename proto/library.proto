syntax = "proto3";

package library;

option csharp_namespace = "Library.Contracts";

import "google/protobuf/timestamp.proto";

service CirculationService {
  rpc CheckOut (CheckOutRequest) returns (LoanView);
  rpc CheckIn (CheckInRequest) returns (LoanView);
  rpc GetLoan (GetLoanRequest) returns (LoanView);
}

service InsightsService {
  rpc MostBorrowedBooks (WindowedTopRequest) returns (PopularBookList);
  rpc MostActivePatrons (WindowedTopRequest) returns (ActivePatronList);
  rpc BorrowedTogether (BorrowedTogetherRequest) returns (BorrowedTogetherList);
  rpc EstimateReadingPace (ReadingPaceRequest) returns (ReadingPaceReport);
}

message CheckOutRequest {
  int32 patron_id = 1;
  int32 book_id = 2;
}

message CheckInRequest { int32 loan_id = 1; }

message GetLoanRequest { int32 loan_id = 1; }

message LoanView {
  int32 loan_id = 1;
  int32 book_id = 2;
  string title = 3;
  int32 patron_id = 4;
  string patron_name = 5;
  google.protobuf.Timestamp checked_out_on = 6;
  // Absent while the book is still out.
  google.protobuf.Timestamp returned_on = 7;
}

// Leaving from/to unset means "all time".
message WindowedTopRequest {
  int32 limit = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message PopularBookList { repeated PopularBook books = 1; }

message PopularBook {
  int32 book_id = 1;
  string title = 2;
  string author = 3;
  int32 times_borrowed = 4;
}

message ActivePatronList { repeated ActivePatron patrons = 1; }

message ActivePatron {
  int32 patron_id = 1;
  string name = 2;
  int32 books_borrowed = 3;
}

message BorrowedTogetherRequest {
  int32 book_id = 1;
  int32 limit = 2;
}

message BorrowedTogetherList { repeated BorrowedTogetherBook books = 1; }

message BorrowedTogetherBook {
  int32 book_id = 1;
  string title = 2;
  string author = 3;
  int32 shared_readers = 4;
}

message ReadingPaceRequest { int32 loan_id = 1; }

message ReadingPaceReport {
  int32 loan_id = 1;
  int32 book_id = 2;
  string title = 3;
  int32 pages = 4;
  int32 patron_id = 5;
  string patron_name = 6;
  google.protobuf.Timestamp checked_out_on = 7;
  google.protobuf.Timestamp returned_on = 8;
  double days_held = 9;
  double pages_per_day = 10;
}
